<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>MLREHAB Manager · 0.5 DEMO</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#191d22" />
    <link rel="apple-touch-icon" href="icon.svg" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="logo">ML<span>REHAB</span><small>MANAGER</small></div>
        <nav id="nav"></nav>
      </aside>
      <div>
        <header>
          <div><strong>MLREHAB</strong><small>MANAGER</small></div>
          <span style="font-size: 11px">PROTOTIPO</span>
        </header>
        <main>
          <div class="notice">
            ⚠️ <b>DEMO SIN SEGURIDAD CLÍNICA.</b> Utiliza solo pacientes
            ficticios. Los datos se guardan en el almacenamiento de este
            navegador y pueden perderse o no persistir al abrir un archivo local
            en iPad. No introduzcas datos sanitarios reales.
          </div>
          <p id="storageStatus" role="status" aria-live="polite"></p>
          <div id="app"></div>
        </main>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div class="dialoghead">
        <h2 id="modalTitle"></h2>
        <button aria-label="Cerrar diálogo" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody"></div>
    </dialog>
    <script src="assets/storage.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
